# Render Blueprint — https://render.com/docs/blueprint-spec
# After connecting this repo, set secret env vars in the Render dashboard.

services:
  - type: web
    name: utarch-api
    runtime: node
    plan: free
    region: virginia
    branch: main
    buildCommand: npm install -g pnpm && pnpm install && pnpm --filter @workspace/api-server build
    startCommand: pnpm --filter @workspace/api-server start
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8080"
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_FOLDER
        value: utarch
